spring:
    datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:docmind}
        username: ${DB_USER:postgres}
        password: ${DB_PASSWORD}

        hikari:
            pool-name: DocMindHikariPool
            maximum-pool-size: 10
            minimum-idle: 2
            connection-timeout: 30000
            validation-timeout: 5000
            idle-timeout: 300000
            max-lifetime: 1200000
            keepalive-time: 300000

    jpa:
        hibernate:
            ddl-auto: update
        open-in-view: false
        show-sql: false
        properties:
            hibernate:
                format_sql: true

    servlet:
        multipart:
            max-file-size: 25MB
            max-request-size: 50MB

    ai:
        openai:
            api-key: ${OPENAI_API_KEY}
            chat:
                model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
                temperature: 0.2
            embedding:
                model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

        vectorstore:
            pgvector:
                index-type: HNSW
                distance-type: COSINE_DISTANCE
                dimensions: 1536
                table-name: vector_store
                schema-name: public
                initialize-schema: true
            # Spring AI Session Memory
        session:
            repository:
                jdbc:
                    initialize-schema: always

app:
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

  rag:
    chunk-size: 700
    top-k: 5
    similarity-threshold: 0.0

  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:3000}
    allowed-methods: GET, POST, PUT, DELETE, OPTIONS
    allowed-headers: "*"

  eval:
    include-metadata: true

  hitl:
    require-admin-role-update-approval: false

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

logging:
  level:
    org.springframework.ai.chat.client.advisor: INFO
